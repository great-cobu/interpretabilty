[project]
name = "models"
version = "0.1.0"
description = "A supervised, command-line MNIST learning and MLOps project"
readme = "README.md"
authors = [
    { name = "Frank W Elliott Jr", email = "frank_elliott@mac.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "lightning>=2.6",
    "torchmetrics>=1.8",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
    "numpy>=2.3",
    "pandas>=2.2.1",
    "scikit-learn>=1.4.1.post1",
    "scipy>=1.12.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.5",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.2",
    "kubernetes>=36.0.3",
    "janus-swi>=1.5.3",
]

[project.optional-dependencies]
mlflow = ["mlflow>=3"]

[dependency-groups]
dev = ["pytest>=9"]
notebooks = [
    "marimo>=0.19",
]

[project.scripts]
mnist-cnn = "models.MNIST.cli:main"
mnist-logistic = "models.logistic.cli:main"
models = "models.main:main"
interpetability = "models.main:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["models", "mnist_cnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an already downloaded real MNIST cache"]
