[project]
name = "interpetability"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Frank W Elliott Jr", email = "frank_elliott@mac.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scikit-learn>=1.4.1.post1",
    "scipy>=1.12.0",
    "torch>=2.2.2",
    "transformers>=4.38.2",
    "datasets>=2.18.0",
    "huggingface-hub>=0.21.4",
    "tokenizers>=0.15.2",
    "mlflow>=2.11.1",
    "pymysql>=1.1.0",
    "cryptography>=42.0.5",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.2",
]

[project.scripts]
interpetability = "interpetability:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
