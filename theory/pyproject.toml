[project]
name = "riemannian-manifolds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Frank W Elliott Jr", email = "frank_elliott@mac.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch>=2.9",
    "numpy>=2.3",
    "scipy>=1.12.0",
    "matplotlib>=3.10",
    "manim>=0.22.0",
]

[dependency-groups]
dev = ["pytest>=9"]
notebooks = [
    "marimo>=0.19",
]

[project.scripts]
riemannian-manifolds = "riemannian_manifolds:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
